name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: [astro-site]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Remove all tracked files from orphan branch
          git checkout --orphan gh-pages
          git rm -rf . || true
          rm -rf * .[!.]* 2>/dev/null || true
          
          # Copy built site
          cp -r dist/. .
          touch .nojekyll
          
          # Force-add everything (including gitignored dist files)
          git add -A -f
          git commit --allow-empty -m "Deploy $(date +%Y-%m-%dT%H:%M:%S) [${{ github.sha }}]"
          
          # Push with explicit refspec
          git push --force origin HEAD:gh-pages
